services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: [python3, /runner/firestore_emulator.py]
    environment:
      FIRESTORE_PROJECT: demo-enterprise-portal
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - firestore-data:/data
      - ./scripts/firestore_emulator.py:/runner/firestore_emulator.py:ro
  init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-env
      FIRESTORE_EMULATOR_HOST: firestore:8787
      FIRESTORE_PROJECT: demo-enterprise-portal
      FIRESTORE_DATABASE: "(default)"
      FIRESTORE_NAMESPACE: portal
      DEMO_MODE: "true"
      WEB_ORIGIN: http://localhost:3000
    command:
      [
        "sh",
        "-c",
        "python scripts/wait_firestore.py && python -m backend.app.demo seed --no-samples",
      ]
    depends_on:
      firestore:
        condition: service_started
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
      MCP_AUTH_MODE: demo
    command: ["uvicorn", "mcp_server.asgi:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  firestore-data:

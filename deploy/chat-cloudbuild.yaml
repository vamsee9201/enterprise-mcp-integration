steps:
  - name: gcr.io/cloud-builders/docker
    id: backend
    args: [build, -f, backend/Dockerfile, -t, '${_REGISTRY}/enterprise-backend:${_TAG}', .]
  - name: gcr.io/cloud-builders/docker
    id: chat
    waitFor: ['-']
    args: [build, -f, chat_app/Dockerfile, -t, '${_REGISTRY}/enterprise-chat:${_TAG}', .]
images:
  - '${_REGISTRY}/enterprise-backend:${_TAG}'
  - '${_REGISTRY}/enterprise-chat:${_TAG}'
substitutions:
  _REGISTRY: us-central1-docker.pkg.dev/ai-lab-502500/cloud-run-source-deploy
  _TAG: demo
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s

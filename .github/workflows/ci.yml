name: Verify enterprise portal
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8787 --quiet > /tmp/firestore.log 2>&1 &
          python scripts/wait_firestore.py
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements-dev.txt
      - run: python -m venv .venv-chat
      - run: .venv-chat/bin/pip install -r chat_app/requirements.txt pytest==9.0.2
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
